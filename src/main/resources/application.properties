spring.application.name=gmailgenie-ai

# Gemini API configuration
gemini.api.key=${GEMINI_KEY:}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Gemini models tried in order when the previous one is rate limited or overloaded
gemini.api.models=${GEMINI_MODELS:gemini-flash-latest,gemini-2.5-flash,gemini-2.5-flash-lite}
gemini.api.request-timeout=${GEMINI_TIMEOUT:10s}

# Actuator exposes health only; details stay private
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
